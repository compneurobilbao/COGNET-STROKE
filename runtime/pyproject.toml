[project]
name = "cognet-runtime"
version = "1.0.0"
description = "Slim runtime of COGNET-STROKE: concept-to-disconnection representation, parcellation, profile and figure. Runtime dependencies only."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "nibabel>=5.2",
    "nilearn>=0.10.4,<0.11",
    "pandas>=2.2",
]

[project.optional-dependencies]
# nilearn imports matplotlib only for plotting; the figure needs it.
plotting = ["matplotlib>=3.9"]
test = ["pytest>=8", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognet_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
