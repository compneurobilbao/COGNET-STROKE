# Step manifest (contract 1.0) of COGNET-STROKE. Validate with contracts/validate.py --kind step.
contract_version: "1.0"
kind: Step
name: cognet-stroke
version: 1.0.0
title: COGNET-STROKE cognitive disconnection profile
description: >-
  Meta-analytic functional decoding of a lesion's functional disconnection. The lesion mask and
  the voxel-wise functional disconnection map (working grid) are reduced to the parcels of the
  concept-map bundle. For every concept, the Concept to Disconnection Representation (CDR: mean
  disconnection inside the concept divided by the mean outside) of the positive and of the
  negative part of the map, and the overlap of the lesion with the concept, are tested against
  the precomputed null concept maps of the bundle (permutation p-value, Bonferroni over
  concepts). Concepts are grouped in domains by the bundle. Writes the profile as JSON (schema
  cognet-profile.schema.json in the contracts) and a figure. Only the runtime part of
  COGNET-STROKE is in the image; concept maps and nulls are generated offline with the analysis
  environment of the repository and supplied as a bundle.
provides: cognet-profile
image:
  repository: docker.io/compneurobilbaolab/cognet-stroke-step
source_url: https://github.com/compneurobilbao/COGNET-STROKE
licence:
  # The repository has no licence file at the time of writing; the SPDX id below is a placeholder
  # for the maintainers to confirm before any image is published.
  spdx: LicenseRef-COGNET-STROKE-unspecified
  third_party:
    - {name: numpy, version: 1.26.4, spdx: BSD-3-Clause}
    - {name: nibabel, version: 5.2.1, spdx: MIT}
    - {name: nilearn, version: 0.10.4, spdx: BSD-3-Clause}
    - {name: pandas, version: 2.2.3, spdx: BSD-3-Clause}
    - {name: scipy, version: 1.12.0, spdx: BSD-3-Clause}
    - {name: scikit-learn, version: 1.5.2, spdx: BSD-3-Clause}
    - {name: matplotlib, version: 3.9.2, spdx: LicenseRef-Matplotlib}

inputs:
  - name: lesion_mask
    type: lesion_mask_mni
    description: Binary lesion mask on the 2 mm MNI152NLin6Asym working grid.
  - name: fdisconnection_map
    type: fdisconnection_map
    description: >-
      Voxel-wise functional disconnection map on the working grid; positive values mean
      disconnection. The positive part and the magnitude of the negative part are analysed
      separately.

outputs:
  - name: profile
    type: cognet_profile
    description: JSON profile, a score and a p-value per concept and per domain for three measures.
  - name: profile_figure
    type: qc_figure
    description: Disconnection map with the lesion outline and the positive-disconnection score per concept.

parameters:
  type: object
  additionalProperties: false
  properties:
    alpha:
      description: Significance level applied to the Bonferroni-corrected p-values.
      type: number
      exclusiveMinimum: 0
      exclusiveMaximum: 1
      default: 0.05

bundles:
  - name: concept_maps
    type: concept-maps
    version: ">=1.0.0, <2.0.0"
    description: >-
      Parcellation on the working grid, the concept table (concept, domain), and per concept the
      concept mask and its null masks over parcels. Layout: cognet_runtime/bundle.py.

resources:
  cpus: 1
  memory_mb: 2048
  wall_time_minutes: 30
  scratch_mb: 256

errors:
  - code: input_missing
    category: input_rejected
    description: A required input was not provided.
  - code: input_format_invalid
    category: input_rejected
    description: An input file does not satisfy its artefact type (format, grid, binary values).
  - code: invalid_parameters
    category: input_rejected
    description: The parameters do not satisfy the step's parameter schema.
  - code: mask_empty
    category: input_rejected
    description: The lesion mask has no voxels set.
  - code: disconnection_not_finite
    category: input_rejected
    description: The disconnection map contains NaN or infinite values.
  - code: disconnection_map_empty
    category: qc_failed
    description: The disconnection map is zero everywhere.
  - code: lesion_outside_parcellation
    category: qc_failed
    description: The lesion does not overlap any parcel of the bundle's parcellation.

reference_test:
  description: >-
    Fully synthetic, generated by tests/make_reference.py from a fixed seed (nothing is
    committed): a block parcellation, six ball-shaped concepts with 1000 null masks each as a
    concept-maps bundle, a ball lesion and a smooth disconnection map on the 2 mm grid. The
    expected profile is computed by a naive implementation that shares no code with the runtime.
  inputs:
    lesion_mask: tests/reference/lesion_mask.nii.gz
    fdisconnection_map: tests/reference/fdisconnection_map.nii.gz
  bundles:
    concept_maps: {id: synthetic-concept-maps, version: 1.0.0}
  parameters:
    alpha: 0.05
  expected:
    profile:
      compare: json
      file: tests/reference/expected/cognet_profile.json
      rtol: 0.000001
      atol: 0.000000001
    profile_figure:
      compare: exists
